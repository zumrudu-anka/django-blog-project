{% extends "layout.html" %}

{% block title %}Giriş yap{% endblock title %}

{% block body %}
<div class="auth">
    <form class="panel" method="POST">{% csrf_token %}
        <div class="auth-head">
            <div class="brand-mark">{% include "includes/logo.html" %}</div>
            <h1>Tekrar hoş geldin</h1>
            <p>Devam etmek için hesabına giriş yap.</p>
        </div>
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-primary btn-lg btn-block">Giriş yap</button>
        <p class="auth-switch">Hesabın yok mu? <a href="{% url 'user:register' %}">Kayıt ol</a></p>
    </form>
</div>
{% endblock body %}
