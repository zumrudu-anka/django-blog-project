{% extends "layout.html" %}

{% block title %}{{ heading }}{% endblock title %}

{% block body %}
<div class="container container-narrow" style="max-width:880px">
    <header class="page-head">
        <a class="back-link" href="{% url 'article:dashboard' %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Panele dön
        </a>
        <h1>{{ heading }}</h1>
    </header>

    <form class="panel" enctype="multipart/form-data" method="POST" style="margin-bottom:96px">{% csrf_token %}
        {{ form.media }}
        {% include "includes/form_fields.html" %}
        <div class="form-actions">
            <a class="btn btn-ghost" href="{% if article %}{{ article.get_absolute_url }}{% else %}{% url 'article:dashboard' %}{% endif %}">Vazgeç</a>
            <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
        </div>
    </form>
</div>
{% endblock body %}
